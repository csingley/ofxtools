[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ofxtools"
version = "1.1.1"
description = "Library for working with Open Financial Exchange (OFX) data"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "GPL-3.0-only"
authors = [{name = "Christopher Singley", email = "csingley@gmail.com"}]
requires-python = ">=3.10"
keywords = ["ofx", "Open Financial Exchange"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
net = ["requests"]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "coveralls",
    "mypy",
    "ruff",
    "ipdb",
    "types-pytz",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/csingley/ofxtools"
Documentation = "https://ofxtools.readthedocs.io/"
Source = "https://github.com/csingley/ofxtools"
"Bug Tracker" = "https://github.com/csingley/ofxtools/issues"

[project.scripts]
ofxget = "ofxtools.scripts.ofxget:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ofxtools = ["py.typed", "config/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["ofxtools"]

[tool.mypy]
files = ["ofxtools"]
strict = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]
